services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - a1738776cd89950025740bfbf6094ccc94d786b11feb0f8de92247001aa5f374:/prometheus
      - /opt/monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - Grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring

volumes:
  Grafana-data:
    external: true
  a1738776cd89950025740bfbf6094ccc94d786b11feb0f8de92247001aa5f374:
    external: true

networks:
  monitoring:
    name: monitoring
    external: true
