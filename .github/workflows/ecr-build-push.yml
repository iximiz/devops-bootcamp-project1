name: Build and Push to ECR

on:
  push:
    branches:
      - main
    paths:
      - "App/**"
      - ".github/workflows/ecr-build-push.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: App
        run: |
          docker build \
            -t 585242447690.dkr.ecr.ap-southeast-1.amazonaws.com/devops-bootcamp/final-project-amirul:latest \
            .

      - name: Push Docker image
        run: |
          docker push \
            585242447690.dkr.ecr.ap-southeast-1.amazonaws.com/devops-bootcamp/final-project-amirul:latest